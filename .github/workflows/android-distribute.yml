# Builds the release APK and ships it to Firebase App Distribution testers.
#
# Required secret:
#   FIREBASE_SERVICE_ACCOUNT  - JSON key for a service account with the
#                               "Firebase App Distribution Admin" role.
#
# Optional secrets (release signing; without them the APK is debug-signed,
# which App Distribution still accepts for internal testers):
#   ANDROID_KEYSTORE_BASE64   - base64 of your upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# See docs/DEPLOYMENT.md for how to create each one.
name: Android distribute

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'web/**'
  workflow_dispatch:
    inputs:
      groups:
        description: 'Comma-separated App Distribution tester groups'
        required: false
        default: 'testers'
      release_notes:
        description: 'Release notes shown to testers'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.35.3'
  # Firebase Android app: MSDevBuild Eats (com.msdvbuild.food)
  FIREBASE_APP_ID: '1:846777623577:android:8fefdbc82283d5ec6a7688'

jobs:
  distribute:
    name: Build and distribute APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Gradle picks up android/key.properties when it exists and falls back to
      # the debug keystore when it does not, so an unsigned fork still builds.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; falling back to debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release --build-number "${{ github.run_number }}"

      - name: Write release notes
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          NOTES="$INPUT_NOTES"
          if [ -z "$NOTES" ]; then
            NOTES="$(git log -1 --pretty=format:'%s')"
          fi
          {
            echo "$NOTES"
            echo
            echo "Build #${{ github.run_number }} - ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"
          } > release-notes.txt

      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. See docs/DEPLOYMENT.md."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      - name: Distribute to testers
        run: |
          npm install --global firebase-tools@13
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file release-notes.txt \
            --groups "${{ github.event.inputs.groups || 'testers' }}"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json" android/key.properties android/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
