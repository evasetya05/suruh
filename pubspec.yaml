name: suruh
description: >-
  SURUH Frontend - Platform Jasa On-Demand Pontianak ("Ada urusan? Suruh kami").
  Frontend untuk Django REST API backend di suruh_backend/compose.yaml.
version: 1.0.0+2
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client for SURUH REST API Backend
  http: ^1.2.2

  # State management (BLoC / Cubit)
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^7.7.0

  # Navigation
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utilities
  url_launcher: ^6.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0

  # Local persistence / offline support (SQLite & SharedPreferences)
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0

  # Connectivity (offline detection)
  connectivity_plus: ^6.0.5

  # Firebase backend (optional at runtime - see AppConfig.backend)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

# ---------------------------------------------------------------------------
# SURUH Platform Frontend
#
# Connects directly to the SURUH Django REST Framework backend API
# (https://suruhjak.teknusa.com). Local SQLite database is used for offline
# caching and fast data delivery.
# ---------------------------------------------------------------------------

flutter:
  uses-material-design: true
